name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-minimum:
    name: Test on minimum Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release metadata guards
        run: python3 .github/scripts/test_release_metadata.py

      - name: Validate stable release metadata
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/release_metadata.py check --before "$BEFORE_SHA"

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  test-current-stable:
    name: Test on current stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (current stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  test-lower-bound:
    name: Test minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Resolve minimum package dependencies
        run: flutter pub downgrade --no-example

      - name: Analyze minimum dependencies
        run: flutter analyze --no-pub

      - name: Test minimum dependencies
        run: flutter test --no-pub

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Install screenshot validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends webp

      - name: Install reviewed Pana
        run: dart pub global activate pana 0.23.19

      - name: Run Pana (full score required)
        run: pana --exit-code-threshold 0 .

  publish-dry-run:
    name: Publish validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Validate package for publication
        run: dart pub publish --dry-run

  build-android:
    name: Example Android APK
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install example dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  build-ios:
    name: Example iOS simulator
    timeout-minutes: 25
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install example dependencies
        run: flutter pub get

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign --no-pub

  build-windows:
    name: Example Windows release
    timeout-minutes: 25
    runs-on: windows-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install example dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Configure Windows argument regression tests
        run: cmake -S windows/tests -B build/windows-utils-tests

      - name: Build Windows argument regression tests
        run: cmake --build build/windows-utils-tests --config Release

      - name: Test Windows argument conversion
        run: ctest --test-dir build/windows-utils-tests -C Release --output-on-failure --no-tests=error

  integration-macos:
    name: Showcase on macOS
    timeout-minutes: 25
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install example dependencies
        run: flutter pub get

      - name: Test showcase on macOS
        run: flutter test --no-pub integration_test/showcase_test.dart -d macos --reporter expanded

      - name: Build macOS release
        run: flutter build macos --release --no-pub

  integration-web-wasm:
    name: Showcase on Chrome Wasm
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter (minimum supported stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Setup matching Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install example dependencies
        run: flutter pub get

      - name: Test showcase on Chrome Wasm
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_VERSION: ${{ steps.chrome.outputs.chrome-version }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          CHROMEDRIVER_VERSION: ${{ steps.chrome.outputs.chromedriver-version }}
        run: |
          set -euo pipefail
          "$CHROME_EXECUTABLE" --version
          "$CHROMEDRIVER_PATH" --version
          if [[ "${CHROME_VERSION%%.*}" != "${CHROMEDRIVER_VERSION%%.*}" ]]; then
            echo 'Chrome and ChromeDriver must have matching major versions.'
            exit 1
          fi
          driver_log="$RUNNER_TEMP/chromedriver.log"
          "$CHROMEDRIVER_PATH" --port=4444 > "$driver_log" 2>&1 &
          driver_pid=$!
          cleanup() {
            driver_status=$?
            kill "$driver_pid" 2>/dev/null || true
            wait "$driver_pid" 2>/dev/null || true
            if [[ "$driver_status" -ne 0 ]]; then
              cat "$driver_log"
            fi
            exit "$driver_status"
          }
          trap cleanup EXIT
          python3 - <<'PYTHON'
          import json
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4444/status', timeout=1) as response:
                      if json.load(response).get('value', {}).get('ready') is True:
                          break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit('ChromeDriver did not become ready within 30 seconds.')
          PYTHON
          flutter drive \
            --no-pub \
            --wasm \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/showcase_test.dart \
            -d web-server \
            --browser-name=chrome \
            --driver-port=4444 \
            --browser-dimension=1600x1024 \
            --chrome-binary="$CHROME_EXECUTABLE" \
            --headless
